[project]
name = "infralens-eval"
version = "0.1.0"
description = "Seeded-incident benchmark harness for the InfraLens MCP server"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.70",
  "mcp>=1.20",
  "boto3>=1.35",
  "pyyaml>=6.0",
]

[project.scripts]
infralens-eval = "infralens_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infralens_eval"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
